installed:
- bug
- product
- tdd
settings:
  auto_execute_hooks: true
hooks:
  after_tasks:
  - extension: tdd
    command: speckit.tdd.plan
    enabled: true
    optional: true
    priority: 10
    prompt: Derive the TDD test list and make the test tasks in tasks.md mandatory?
    description: Generate specs/<feature>/tdd/test-list.md from spec.md and plan.md,
      then reorder tasks.md so every behavior has a failing test before its implementation
    condition: null
  before_implement:
  - extension: tdd
    command: speckit.tdd.run
    enabled: true
    optional: false
    priority: 10
    prompt: Drive the behavioral tasks through the red-green-refactor loop first?
    description: Run the loop over every behavior on the feature's tdd/test-list.md,
      one failing test at a time with the red recorded, ticking the tasks each behavior
      completes so /speckit.implement then covers only the work that is not a behavior
      change
    condition: null
  after_implement:
  - extension: tdd
    command: speckit.tdd.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Audit TDD discipline and test strength for this feature?
    description: 'Write specs/<feature>/tdd/verification.md: test-first evidence,
      test-smell rubric, mutation results, and acceptance-criteria coverage'
    condition: null
  after_specify:
  - extension: product
    command: speckit.product.brief
    enabled: true
    optional: true
    priority: 10
    prompt: Generate the product brief (product/00-info.md + product/10-spec.md) from
      the new spec.md?
    description: Generate product/00-info.md and product/10-spec.md from spec.md (recommended
      first artifacts)
    condition: null
  after_clarify:
  - extension: product
    command: speckit.product.brief
    enabled: true
    optional: true
    priority: 10
    prompt: Regenerate the product brief after clarification?
    description: Update product/00-info.md and product/10-spec.md from the clarified
      spec.md
    condition: null
  after_plan:
  - extension: product
    command: speckit.product.plan
    enabled: true
    optional: true
    priority: 10
    prompt: Generate the product-facing plan product/20-plan.md from plan.md?
    description: Generate product/20-plan.md from plan.md
    condition: null
  - extension: product
    command: speckit.product.design
    enabled: true
    optional: true
    priority: 20
    prompt: Generate the technical design product/30-design.md from plan.md, research.md,
      and contracts/?
    description: Generate product/30-design.md from plan.md, spec.md, and the optional
      plan outputs (research.md, data-model.md, contracts/)
    condition: null
